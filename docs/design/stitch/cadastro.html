<main class="flex-grow pt-24 pb-12 flex items-center justify-center relative">

<section class="w-full max-w-md px-margin-mobile">
<div class="glass-card rounded-xl p-8 md:p-10 shadow-xl border border-outline-variant/30">
<div class="text-center mb-10">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-on-surface mb-2">Crie sua conta</h1>
<p class="text-on-surface-variant font-body-md">Comece a gerar conteúdo inteligente em segundos.</p>
</div>
<!-- Signup Form -->
<form class="space-y-6" onsubmit="return false;">
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant ml-1" for="name">Nome Completo</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">person</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 transition-all focus:outline-none focus:ring-0 input-inset-glow font-body-md" id="name" name="name" placeholder="Como devemos te chamar?" type="text"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant ml-1" for="email">E-mail</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">mail</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 transition-all focus:outline-none focus:ring-0 input-inset-glow font-body-md" id="email" name="email" placeholder="seu@email.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<label class="block font-label-md text-on-surface-variant ml-1" for="password">Senha</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[20px]">lock</span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/50 transition-all focus:outline-none focus:ring-0 input-inset-glow font-body-md" id="password" name="password" placeholder="Mínimo 8 caracteres" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-3 mt-4">
<div class="flex items-center h-5">
<input class="h-5 w-5 rounded border-outline-variant bg-surface-container text-primary-container focus:ring-primary focus:ring-offset-background transition-colors cursor-pointer" id="terms" name="terms" type="checkbox"/>
</div>
<label class="text-on-surface-variant font-label-md leading-tight cursor-pointer" for="terms">
                            Aceito os <a class="text-primary hover:underline transition-all" href="#">Termos de Uso</a> e <a class="text-primary hover:underline transition-all" href="#">Política de Privacidade</a>
</label>

<button class="w-full bg-primary-container text-on-primary-container font-headline-md py-4 rounded-lg shadow-lg hover:opacity-90 active:scale-[0.98] transition-all duration-200" type="submit">

<script>
        // Micro-interactions for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-95');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-95');
            });
        });

        // Simple glow effect follow mouse on the card
        const card = document.querySelector('.glass-card');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
