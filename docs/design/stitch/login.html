<!-- Micro-interaction Script -->
<script>
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple parallax for the background glow
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const light1 = document.querySelector('.blur-\\[120px\\]');
            const light2 = document.querySelector('.blur-\\[150px\\]');
            
            light1.style.transform = `translate(${x * 50}px, ${y * 50}px)`;
            light2.style.transform = `translate(${-x * 30}px, ${-y * 30}px)`;
        });
    </script>
