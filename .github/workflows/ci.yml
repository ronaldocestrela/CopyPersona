name: PersonaScript AI - CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

env:
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint-and-format:
    name: Code Style & Lint (dotnet format)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verificar Formatação e Estilo de Código
        run: dotnet format --verify-no-changes

  build-and-test:
    name: Build & Testes Automatizados (TDD & Tenancy)
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache de Pacotes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar Dependências
        run: dotnet restore PersonaScript.slnx

      - name: Compilar Solução (.NET 10 Release)
        run: dotnet build PersonaScript.slnx --configuration Release --no-restore

      - name: Executar Suíte de Testes com Cobertura
        run: >
          dotnet test PersonaScript.slnx
          --configuration Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publicar Resultados dos Testes como Artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

  security-audit:
    name: Auditoria de Segurança de Dependências NuGet
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verificar Vulnerabilidades em Pacotes
        run: dotnet list package --vulnerable --include-transitive
